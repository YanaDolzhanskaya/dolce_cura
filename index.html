<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dolce Cura</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:ital@1&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF4EF; --card:#FFFCFA; --blush:#F7E1DF; --blush2:#F1CFCF; --rose:#E2A2AA; --rose-deep:#B96C79;
  --cocoa:#5B3F40; --muted:#7F6764; --line:#F0E1DC; --milk:#FFF8F2; --sage:#B7C4A8; --lemon:#F3DD8C;
  color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--cocoa);font:16px/1.5 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px}
img{max-width:100%}
.app{max-width:500px;margin:0 auto;padding:18px 18px 130px}
.hand{font-family:'Caveat','Segoe Print',cursive;font-size:22px;line-height:1.2;color:var(--rose-deep)}
.muted{color:var(--muted)}
.small{font-size:14px}

header{display:flex;justify-content:space-between;align-items:flex-start;margin:4px 0 18px}
.hello{display:flex;gap:10px;align-items:center}
.hello svg{width:44px;height:44px;flex:none}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:30px;line-height:1.05;margin:0}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:17px;color:var(--rose-deep);line-height:1;margin-bottom:2px}
.date{font-size:14px;color:var(--muted);margin-top:4px}
.gear{border:none;background:var(--blush);width:40px;height:40px;border-radius:50%;font-size:17px;color:var(--rose-deep)}

.card{background:var(--card);border-radius:26px;padding:18px;margin-bottom:12px;box-shadow:0 10px 30px -18px rgba(185,108,121,.45)}
.card h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:25px;line-height:1.15;margin:0 0 4px}
.card .sub{margin:0 0 16px;font-size:14px;color:var(--muted)}

/* moodboard */
.board{padding:10px}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:8px}
.pin{display:block;width:100%;margin:0;border:none;padding:0;background:var(--blush);border-radius:18px;overflow:hidden}
.pin img{display:block;width:100%;height:100%;object-fit:cover}
.pin.add{aspect-ratio:3/4;background:var(--milk);border:1.5px dashed var(--blush2);color:var(--rose-deep);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pin.add svg{width:64px;height:64px}
.pin.add.plus{aspect-ratio:3/4;font-size:34px;font-weight:400;color:var(--rose)}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--blush);border-radius:999px;padding:4px;margin:0 0 16px}
.tabs button{border:none;background:none;border-radius:999px;padding:9px 0;font-size:15px;color:var(--rose-deep);font-weight:600}
.tabs button.on{background:var(--card);color:var(--cocoa);box-shadow:0 2px 8px -4px rgba(185,108,121,.5)}
.bella .hand{font-size:22px;line-height:1.2;margin:6px 0 10px}
.board-empty{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board-empty .pin.add:first-child{grid-row:span 2;aspect-ratio:auto}
.board-body{padding:8px 10px 8px}
.why{margin:4px 0 6px;font-size:25px}
.linkbtn{border:none;background:none;padding:0;color:var(--rose-deep);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* sprint */
.sprint{background:linear-gradient(160deg,var(--blush) 0%,var(--milk) 75%);position:relative;overflow:hidden}
.sprint .deco{position:absolute;right:-22px;top:-26px;width:104px;opacity:.85}
.sprint > *:not(.deco){position:relative;z-index:1}
.sprint .n{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:24px;line-height:1.2;color:var(--cocoa);margin:6px 0 2px}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin:16px 0 6px}
.dots i{aspect-ratio:1;border-radius:50%;background:#fff;border:1.5px solid var(--blush2)}
.dots i.past{background:var(--rose);border-color:var(--rose)}
.dots i.now{background:#fff;border:2px solid var(--rose-deep)}
.dots i.wk{margin-left:6px}
.sprint .hand{margin:10px 0 0}

/* forms */
.daynav{display:flex;gap:6px}
.daynav button{border:none;background:var(--blush);width:34px;height:34px;border-radius:50%;color:var(--rose-deep);font-size:17px}
.daynav button:disabled{opacity:.35;cursor:default}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{margin-top:16px}
.field label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.inrow{display:flex;align-items:center;gap:10px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--milk);border-radius:14px;padding:10px 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--rose)}
.inrow .inp{max-width:130px}
.unit{color:var(--muted);font-size:15px}
.soft{height:10px;border-radius:99px;background:var(--blush);overflow:hidden;margin-top:10px}
.soft i{display:block;height:100%;border-radius:99px;background:var(--rose);transition:width .3s}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--blush2);background:transparent;border-radius:999px;padding:9px 16px;font-size:15px;color:var(--cocoa)}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:none;background:var(--milk);border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mood i{width:26px;height:26px;border-radius:50%;display:block}
.mood.on{background:var(--blush);color:var(--cocoa);font-weight:600}
.mood.on i{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--rose-deep)}

/* week */
.goal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:none;padding-bottom:0}
.goal .t{font-size:16px}
.goal .v{font-size:14px;color:var(--muted);text-align:right}
.pips{display:flex;gap:6px}
.pips i{width:14px;height:14px;border-radius:50%;background:var(--blush);border:1.5px solid var(--blush2)}
.pips i.on{background:var(--rose);border-color:var(--rose)}
.goal .soft{grid-column:1/-1;margin-top:4px}
.heart{color:var(--rose-deep)}

.btn{border:none;border-radius:18px;padding:13px 20px;font-weight:600;font-size:15px;background:var(--rose-deep);color:#fff}
.btn.ghost{background:var(--blush);color:var(--rose-deep)}
.btn.full{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
textarea.inp{min-height:84px;resize:vertical;font-size:16px}
.hist{margin:0;padding:0;list-style:none}
.hist li{padding:12px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:none}
.hist .top{display:flex;justify-content:space-between;gap:10px}
.hist .top b{font-weight:600}
.hist .hand{font-size:20px;margin-top:4px}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:22px}

/* dolce */
.fab.hide{opacity:0;pointer-events:none;transform:translate(-50%,20px)}
.fab{transition:opacity .2s,transform .2s}
.fab.mini{padding:13px;gap:0}
.fab.mini .fl{display:none}
.fab{transition:padding .2s;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;border:none;border-radius:999px;padding:13px 22px 13px 16px;background:var(--cocoa);color:var(--cream);font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px -10px rgba(91,63,64,.6)}
.fab svg{width:26px;height:26px}
.reasons{display:grid;gap:8px}
.reason{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;font-size:16px}
.reason small{display:block;color:var(--muted);font-size:13px}
.it{background:var(--milk);border-radius:24px;padding:18px;text-align:center;margin:14px 0;position:relative;overflow:hidden}
.it .tile{position:absolute;inset:0;width:100%;height:100%;opacity:.28;pointer-events:none}
.it > *:not(.tile){position:relative}
.it .ph{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:30px;line-height:1.15;margin:0}
.it .tr{margin:8px 0 2px;font-size:16px}
.it .pr{font-size:14px;color:var(--muted);margin:0}
.ring{display:block;width:150px;height:150px;margin:6px auto 4px}
.ring .bg{stroke:var(--blush)}
.ring .fg{stroke:var(--rose-deep);transition:stroke-dashoffset 1s linear}
.ring text{fill:var(--cocoa);font:600 28px 'Manrope',sans-serif}
.tip{background:var(--blush);border-radius:20px;padding:14px 16px;margin:0 0 12px;font-size:15px}

.modal{position:fixed;inset:0;background:rgba(91,63,64,.28);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--cream);width:100%;max-width:500px;border-radius:30px 30px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:28px;margin:0 0 6px}
.sheet .lead{margin:0 0 16px;color:var(--muted)}
.sheet .lead + .field,.sheet .lead + .two > .field{margin-top:0}
.viewer img{display:block;width:100%;border-radius:22px;margin-bottom:14px}
.plate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plate .ph{position:relative;aspect-ratio:1;border:none;padding:0;border-radius:18px;overflow:hidden;background:var(--blush)}
.plate .ph img{width:100%;height:100%;object-fit:cover;display:block}
.plate .ph span{position:absolute;left:6px;bottom:6px;background:rgba(255,252,250,.9);border-radius:10px;padding:1px 7px;font-size:12px;color:var(--cocoa)}
.plate .ph.add{background:var(--milk);border:1.5px dashed var(--blush2);color:var(--rose-deep);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.plate .ph.add svg{width:34px;height:34px}
.morning{text-align:center;padding-top:6px}
.morning svg{width:84px;height:84px}
.itq{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:24px;line-height:1.2;margin:12px 0 0;max-width:85%}
.morning .q{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;line-height:1.2;margin:10px 0 18px}
.bella{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center;padding:16px 20px 16px 12px}
.bella svg{width:128px;height:auto;display:block}
.bella h2{margin-bottom:2px}
.bella .new{margin:8px 0 10px;font-size:14px}
.bella .new b{font-weight:600;color:var(--rose-deep)}
.bl{list-style:none;margin:0 0 6px;padding:0}
.bl li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bl li:last-child{border-bottom:none}
.bl li i{font-style:normal;color:var(--rose-deep);width:14px;flex:none}
.bl li.no{color:var(--muted)}
.bl small{display:block;color:var(--muted);font-size:13px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .chip{padding:12px 0;font-size:17px;font-weight:600}
.wave{position:relative;height:110px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--milk),var(--blush));margin:6px 0 10px}
.wave svg{position:absolute;left:0;bottom:0;width:200%;height:90px;animation:swell 7s ease-in-out infinite}
.wave .w1{fill:var(--rose);opacity:.55}
.wave .w2{fill:var(--rose-deep);opacity:.25}
@keyframes swell{0%{transform:translateX(0) translateY(6px)}50%{transform:translateX(-25%) translateY(-6px)}100%{transform:translateX(-50%) translateY(6px)}}
.wave-t{position:absolute;top:14px;left:0;right:0;text-align:center;font:600 30px 'Manrope',sans-serif;color:var(--cocoa)}
.wave-p{min-height:48px;margin:0 0 4px;font-size:16px;text-align:center}
.myl{list-style:none;margin:0 0 12px;padding:0}
.myl li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.myl .x{border:none;background:none;color:var(--muted);font-size:20px}
.plans{border:1.5px dashed var(--rose);border-radius:20px;padding:10px 14px;margin:0 0 12px}
.plans p{margin:4px 0;font-size:15px}
.plans span{font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--rose-deep)}
.pat{margin:0;padding:0;list-style:none}
.pat li{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.pat li:last-child{border-bottom:none}
.plan-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.plan-row span.k{font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--rose-deep)}
.help details{background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:8px}
.help summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:"+";color:var(--rose-deep);font-size:20px;font-weight:400}
.help details[open] summary::after{content:"−"}
.help p,.help li{font-size:15px;line-height:1.5}
.help ul,.help ol{padding-left:20px;margin:8px 0}
.help p{margin:8px 0}
.closeday{margin:0 0 14px;padding:16px 20px;font-size:16px;box-shadow:0 12px 26px -14px rgba(185,108,121,.8)}
.donecard .okmark{font-family:'Manrope',sans-serif;font-size:14px;font-weight:600;color:var(--rose-deep);margin-left:6px;vertical-align:middle}
.drow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.drow span{color:var(--muted)}
.drow b{font-weight:600}
.plate.mini{grid-template-columns:repeat(5,1fr);margin-top:12px;gap:6px}
.plate.mini .ph{border-radius:12px}
.celebr{text-align:center;padding-top:6px;position:relative}
.celebr > svg{width:84px;height:84px}
.celebr .big{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:34px;margin:8px 0 4px}
.petal{position:fixed;top:-20px;width:12px;height:16px;border-radius:60% 40% 60% 40%;z-index:40;pointer-events:none;animation:petal 2.6s ease-in forwards}
@keyframes petal{to{transform:translateY(105vh) rotate(260deg) translateX(40px);opacity:.3}}
.ach{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.ach span{background:var(--blush);color:var(--rose-deep);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.rh{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:21px;margin:16px 0 4px}
.lib small{color:var(--rose-deep)}
.eat{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.eat .muted{font-size:13px}
.words{display:flex;flex-direction:column;gap:2px}
.wrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.wrow:last-child{border-bottom:none}
.wit{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:18px;color:var(--cocoa)}
.wex{font-size:14px;margin-top:2px;font-style:italic}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{border:1.5px solid var(--blush2);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--cocoa)}
.rchip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.linkbtn.small{font-size:13px}
.sprint.top{padding:16px 18px}
.toprow{display:flex;gap:12px;align-items:center}
.mini-bella{border:none;background:var(--milk);border-radius:50%;width:64px;height:64px;flex:none;overflow:hidden;padding:0}
.mini-bella svg{width:100%;height:auto;margin-top:2px}
.why1{font-size:18px;margin:4px 0 0}
.wordsrow{display:flex;gap:6px;align-items:baseline;width:100%;border:none;background:rgba(255,255,255,.6);border-radius:14px;padding:10px 12px;margin-top:10px;text-align:left;font-size:14px}
.wordsrow .wl{flex:1;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:16px;color:var(--cocoa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daycard h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:20px;margin:22px 0 2px;padding-top:16px;border-top:1px solid var(--line)}
.prog{font-size:13px;font-weight:600;color:var(--rose-deep);background:var(--blush);border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle;font-family:'Manrope',sans-serif}
.left{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0}
.wk .goal{padding:9px 0}
.wk .mini{font-size:14px;color:var(--muted);margin:8px 0 0}
details.grp{border-top:1px solid var(--line);padding:12px 0}
details.grp > summary{font-weight:600;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.grp > summary::after{content:'+';color:var(--rose-deep)}
details.grp[open] > summary::after{content:'–'}
.hero{display:block;width:100%;text-align:left;border:none;border-radius:28px;padding:20px 22px;margin:0 0 14px;background:var(--cocoa);color:var(--cream);box-shadow:0 14px 30px -16px rgba(91,63,64,.8)}
.hero-t{display:block;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:28px;line-height:1.1}
.hero-s{display:block;font-size:14px;opacity:.8;margin-top:6px}
.bloom{font-size:13px;color:var(--muted)}
.bloom i{display:block;height:6px;border-radius:9px;background:var(--blush);margin-top:5px;overflow:hidden}
.bloom b{display:block;height:100%;background:var(--rose);border-radius:9px}
.x{border:none;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}
.cpill{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 16px;cursor:text}
.cpill input{width:52px;border:none;border-radius:999px;background:var(--milk);padding:5px 8px;font-size:15px;text-align:center;color:var(--cocoa)}
.cpill.on input{background:rgba(255,255,255,.9)}
.rchecks{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.rcheck{display:flex;align-items:center;gap:10px;border:none;background:none;padding:7px 0;text-align:left;font-size:15px;color:var(--cocoa)}
.rcheck i{flex:none;width:22px;height:22px;border-radius:7px;border:1.8px solid var(--rose);display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.rcheck.on i{background:var(--rose)}
.rcheck.on{color:var(--muted)}
.pmlist{display:flex;flex-direction:column}
.ghostchip{border-style:dashed;color:var(--muted);font-size:14px;padding:7px 12px}
.pmrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.pmrow:last-child{border-bottom:none}
.pmdo{flex:1;border:none;background:none;text-align:left;padding:10px 0;font-size:15px;color:var(--cocoa)}
.pmdo small{display:block;font-size:12px;color:var(--muted)}
.notes{min-height:96px;resize:none;line-height:1.45;margin-top:10px}
.chip{white-space:normal;text-align:left;max-width:100%}
.sheet{overflow-x:hidden}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cocoa);color:var(--cream);padding:10px 18px;border-radius:18px;font-size:15px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Telegram и хранилище ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const cloudOk = inTg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('6.9');
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#FBF4EF'); tg.setBackgroundColor && tg.setBackgroundColor('#FBF4EF'); } catch (e) {} }
const haptic = () => { try { inTg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('soft'); } catch (e) {} };

const PFX = 'dn_';
const Store = {
  async keys(){
    if (cloudOk) return new Promise(r => tg.CloudStorage.getKeys((e,k) => r(e ? [] : (k || []))));
    const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PFX)) out.push(k.slice(PFX.length)); } } catch (e) {}
    return out;
  },
  async getMany(keys){
    const out = {};
    if (cloudOk) { for (let i = 0; i < keys.length; i += 20) {
        const got = await new Promise(r => tg.CloudStorage.getItems(keys.slice(i, i+20), (e,v) => r(e ? {} : (v || {}))));
        Object.assign(out, got); } return out; }
    try { keys.forEach(k => { const v = localStorage.getItem(PFX + k); if (v != null) out[k] = v; }); } catch (e) {}
    return out;
  },
  async getAll(){
    if (cloudOk) {
      const keys = (await Store.keys()).filter(k => !k.startsWith('f_'));
      const out = {};
      for (let i = 0; i < keys.length; i += 20) {
        const got = await new Promise(r => tg.CloudStorage.getItems(keys.slice(i, i+20), (e,v) => r(e ? {} : (v || {}))));
        Object.assign(out, got);
      }
      return out;
    }
    const out = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PFX) && !k.startsWith(PFX + 'f_')) out[k.slice(PFX.length)] = localStorage.getItem(k); } } catch (e) {}
    return out;
  },
  set(key, val){
    const s = JSON.stringify(val);
    if (cloudOk) return new Promise(r => tg.CloudStorage.setItem(key, s, e => { if (e) toast('Не получилось сохранить, попробуй ещё раз'); r(); }));
    try { localStorage.setItem(PFX + key, s); } catch (e) { toast('Не хватило места в браузере'); }
    return Promise.resolve();
  },
  remove(keys){
    if (!keys.length) return Promise.resolve();
    if (cloudOk) return new Promise(r => tg.CloudStorage.removeItems(keys, () => r()));
    try { keys.forEach(k => localStorage.removeItem(PFX + k)); } catch (e) {}
    return Promise.resolve();
  }
};

/* ---------- даты ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => iso(new Date());

function plural(n,a,b,c){ n = Math.abs(n) % 100; const m = n % 10; if (n > 10 && n < 20) return c; if (m > 1 && m < 5) return b; if (m === 1) return a; return c; }

  days: {}, good: {}, meas: [], notes: {}, photos: [], lib: [], pm: [], vocab: [], vocabRaw: '', eat: {}, legacy: new Set(), view: today()

async function load(){
  const all = await Store.getAll();
  const j = k => { try { return all[k] ? JSON.parse(all[k]) : null; } catch (e) { return null; } };
  if (j('cfg')) Object.assign(S.cfg, j('cfg'));
  S.meas = j('meas') || []; S.notes = j('notes') || {};
  Object.keys(all).forEach(k => {
    let m = k.match(/^d_(\d{4})_(\d{2})(?:_([abc]))?$/);
    if (m) { const mo = j(k) || {}; Object.keys(mo).forEach(dd => S.days[`${m[1]}-${m[2]}-${dd}`] = mo[dd]); if (!m[3]) S.legacy.add(`${m[1]}-${m[2]}`); }
    m = k.match(/^g_(\d{4})_(\d{2})$/);
    if (m) { const mo = j(k) || {}; Object.keys(mo).forEach(dd => S.good[`${m[1]}-${m[2]}-${dd}`] = mo[dd]); }
  });
  S.lib = j('lib') || []; S.known = j('known') || []; S.pm = j('pm') || [];
  const vn = j('vocn'); if (vn) { let t = ''; for (let i = 0; i < vn; i++) t += j('voc_' + i) || ''; S.vocab = parseVocab(t); S.vocabRaw = t; }
  const cutE = ymd(addDays(today(), -60)); const oldE = [];
  const parts = {};
  Object.keys(all).forEach(k => { const m = k.match(/^e_(\d{8})(?:_(\d+))?$/); if (!m) return;
    if (m[1] < cutE) { oldE.push(k); return; }
    (parts[m[1]] = parts[m[1]] || [])[+(m[2] || 0)] = j(k); });
  Object.keys(parts).forEach(y => { const p = parts[y], ds = `${y.slice(0,4)}-${y.slice(4,6)}-${y.slice(6)}`;
    S.eat[ds] = Array.isArray(p[0]) ? p[0].map(e => (e[0] ? e[0] + ' ' : '') + e[1]).join('\n') : p.map(x => x || '').join(''); });
  if (oldE.length) Store.remove(oldE);
  // «Тарелка» убрана — чистим её старые фото из облака
  try { const old = (await Store.keys()).filter(k => /^fi?_/.test(k)); if (old.length) Store.remove(old); } catch (e) {}
  const mb = j('mb') || [];
  S.photos = mb.map(p => { let t = ''; for (let i = 0; i < p.n; i++) t += j(`p_${p.id}_${i}`) || ''; return {id:p.id, n:p.n, src:t}; }).filter(p => p.src.startsWith('data:image'));
  const oldN = j('imgn'); // фото из прошлой версии
  if (oldN && !mb.length) { let t = ''; for (let i = 0; i < oldN; i++) t += j('img_' + i) || '';
    if (t.startsWith('data:image')) { await savePhoto(t); await Store.set('imgn', 0); } }
}
const saveCfg = () => Store.set('cfg', S.cfg);
function saveMonth(ds, key='d', src=S.days){ const [y,m] = ds.split('-'); const out = {};
  Object.keys(src).forEach(k => { if (k.startsWith(`${y}-${m}-`) && src[k] != null && src[k] !== '') out[k.slice(8)] = src[k]; });
  return Store.set(`${key}_${y}_${m}`, out); }
// дни храним по третям месяца, чтобы запись не упиралась в лимит 4096 символов на ключ
const part = dd => +dd <= 10 ? 'a' : +dd <= 20 ? 'b' : 'c';
async function saveDays(ds){
  const [y, m, dd] = ds.split('-'), ym = `${y}-${m}`;
  const parts = S.legacy.has(ym) ? ['a','b','c'] : [part(dd)];
  await Promise.all(parts.map(p => { const out = {};
    Object.keys(S.days).forEach(k => { if (k.startsWith(ym + '-') && part(k.slice(8)) === p && S.days[k]) out[k.slice(8)] = S.days[k]; });
    return Store.set(`d_${y}_${m}_${p}`, out); }));
  if (S.legacy.has(ym)) { S.legacy.delete(ym); await Store.remove([`d_${y}_${m}`]); }
}
async function savePhoto(src){
  const id = Date.now().toString(36).slice(-6); const parts = [];
  for (let i = 0; i < src.length; i += 4000) parts.push(src.slice(i, i + 4000));
  await Promise.all(parts.map((p, i) => Store.set(`p_${id}_${i}`, p)));
  S.photos.push({id, n: parts.length, src});
  await Store.set('mb', S.photos.map(p => ({id:p.id, n:p.n})));
}
async function deletePhoto(id){
  const p = S.photos.find(x => x.id === id); if (!p) return;
  S.photos = S.photos.filter(x => x.id !== id);
  await Store.set('mb', S.photos.map(x => ({id:x.id, n:x.n})));
  await Store.remove(Array.from({length:p.n}, (_, i) => `p_${id}_${i}`));
}

  const n = Math.min(S.cfg.wpd || 4, left), L = base.length; let k = ((diff('2026-01-01', today()) * n) % L + L) % L;

}

  }

    const lib = [...S.lib].sort((a, b) => b.n - a.n).filter(x => x.t.toLowerCase().trim() !== pre.toLowerCase().trim()).slice(0, 6);
    modal(`<h2>Что помогло?</h2><p class="lead">Своими словами. В следующий раз твои приёмы будут первыми.</p>
      ${lib.length ? `<div class="chips" style="margin-bottom:10px">${lib.map(x => `<button class="chip" data-act="helped-pick" data-t="${esc(x.t)}">${esc(x.t)}</button>`).join('')}</div>` : ''}
      <input class="inp" id="helped" maxlength="60" value="${esc(pre)}" placeholder="например, вышла на балкон и подышала">
      <button class="btn full" style="margin-top:14px" data-act="helped-save">Сохранить</button>
      <button class="btn ghost full" style="margin-top:8px" data-act="helped-skip">Не знаю, пропустить</button>`); },
  'helped-pick': b => { document.getElementById('helped').value = b.dataset.t; },
  'helped-save': async () => { const t = document.getElementById('helped').value.trim().slice(0,60);
    let id = '';
    if (t) { const key = t.toLowerCase().replace(/\s+/g, ' ');
      let x = S.lib.find(l => l.t.toLowerCase().replace(/\s+/g, ' ') === key);
      if (x) x.n++; else { x = {id: Date.now().toString(36).slice(-5), t, n: 1}; S.lib.push(x); }
      S.lib = S.lib.sort((a, b) => b.n - a.n).slice(0, 30); id = x.id; await Store.set('lib', S.lib); }
    await A.winDone(id); },
  'helped-skip': async () => { await A.winDone(''); },
  winDone: async id => {
    const st = S.cfg.swst || {}; if (U.opt && !U.opt.startsWith('L:')) { const [t, p] = st[U.opt] || [0, 0]; st[U.opt] = [t + 1, p + 1]; S.cfg.swst = st; saveCfg(); }
    await logUrge(U.r, 'p', U.b, 0, U.opt, id); haptic();
    const w = wins();
    modal(`<h2>Brava!</h2><p class="lead">Волна прошла, а ты осталась собой. В копилке побед уже <b>${w}</b> ${plural(w,'волна','волны','волн')}.</p>${itCard()}<button class="btn full" data-act="bg-close">Grazie</button>`);
    render(); },
  'close-day': async () => { const v = S.view;
    S.days[v] = Object.assign({}, S.days[v] || {}, {done: 1}); S.editing = null; await saveDays(v); haptic();
    const cnt = Object.values(S.days).filter(x => x && x.done).length;
    petals();
    const ph = IT[Math.floor(Math.random() * IT.length)];
    modal(`<div class="celebr">${ART.flower}<p class="big">Giornata completata</p><p style="margin:0 0 4px">День записан ♡</p>
      <p class="small muted" style="margin:0 0 16px">Это твой ${cnt}-й записанный день. Каждый из них — забота о себе.</p>
      <div class="it">${ART.tile}<p class="ph">${ph[0]}</p><p class="tr">${ph[1]}</p></div>
      <button class="btn full" data-act="day-ok">Grazie</button></div>`); render(); },
  'day-ok': () => { close(); scrollTo({top: 0, behavior: 'smooth'}); },
  'edit-day': () => { S.editing = S.view; render(); },
  over: () => { U = {};
    modal(`<h2>Это эпизод, а не провал</h2>
      <div class="tip">Один раз съесть больше — это не «всё испорчено». Не нужно ничего компенсировать: следующий приём пищи — как обычно, без наказаний и пропусков. Ты по-прежнему на своём пути.</div>
      <p class="lead" style="margin-bottom:10px">Что было перед этим? Это просто подсказка на будущее.</p>
      <div class="chips">${['t','s','a','l','b','h','p','y'].map(k => `<button class="chip" data-act="over-why" data-v="${k}">${REASON[k][0].toUpperCase() + REASON[k].slice(1)}</button>`).join('')}</div>`); },
  'over-why': async b => { const t = today(), d = S.days[t] || {}; const x = (d.x || []).slice(-4);
    x.push([new Date().getHours(), b.dataset.v]); S.days[t] = Object.assign({}, d, {x}); await saveDays(t);
    modal(`<h2>Записала</h2><p class="lead">${b.dataset.v === 'y' ? 'Вкусная еда — это нормально, и удовольствие от неё тоже.' : `Перед этим была ${REASON[b.dataset.v]}. Это ценная подсказка, а не повод себя ругать.`} Будь к себе сейчас так же добра, как была бы к подруге.</p>
      <div class="it">${ART.tile}<p class="ph">Sii dolce con te stessa</p><p class="tr">Будь нежна к себе</p></div>
      <button class="btn full" data-act="bg-close">Grazie</button>
      <button class="btn ghost full" style="margin-top:8px" data-act="ex-open-tab" data-v="chain">Разобрать цепочку событий</button>`); render(); },
  help: () => modal(`<h2>Как пользоваться</h2><p class="lead">Всё сохраняется само — кнопки «Сохранить» нет. Когда цифра записалась, появляется «Сохранено ✓».</p>
    <div class="help">
    <details><summary>Бот</summary>
      <p>Бот — будильник: сам пишет тебе, но на сообщения не отвечает и не видит, что ты внесла в приложение.</p>
      <ul><li><b>9:00</b> — итальянская фраза дня с переводом и произношением.</li>
      <li><b>21:00</b> — мягкое напоминание записать день. В пятницу — совет про выходные, в воскресенье — отметить выходные хотя бы примерно.</li>
      <li><b>Последний день спринта</b> — напоминание открыть итоги.</li>
      <li><b>Кнопка Dolce Cura</b> слева от поля ввода открывает приложение.</li></ul>
      <p>В Apps Script: <b>pause</b> выключает напоминания (отпуск, болезнь), <b>resume</b> включает обратно.</p></details>
    <details><summary>Мой день</summary>
      <ul><li><b>Bella</b> — её образ собирается из твоих заботливых дел, силуэт меняется только по итогам спринтов. Нажми на неё, чтобы увидеть, что уже есть и что будет дальше.</li>
      <li><b>Спринт</b> — день из 14 и фраза дня.</li>
      <li><b>Ритуалы</b> — простой список с галочками: витамины, уход, движение. Настраиваются прямо в карточке «Сегодня».</li>
      <li><b>Сегодня</b> — калории, шаги, силовая и пилатес, кардио в минутах. На выходных можно просто выбрать «как в будни», «чуть больше» или «праздник». Стрелки ‹ › — вернуться до двух недель назад.</li>
      <li><b>Заметки</b> — одно поле без ограничений: еда, мысли, что было приятного. Сохраняется само.</li>
      <li><b>Как ты?</b> — настроение, сон и удовольствие не про еду. Лучше вечером.</li>
      <li><b>Неделя</b> — тренировки, шаги, среднее по калориям и итоги «Тянет заесть».</li></ul></details>
    <details><summary>Спринты</summary>
      <ul><li><b>Мои спринты</b> — копилка побед и итоги каждого спринта: примерка, вес, наблюдения. «Открыть итоги» показывает их снова.</li>
      <li><b>Когда тянет</b> — карта: в какое время, почему, будни или выходные.</li>
      <li><b>Упражнения</b> — пять коротких техник из психологии привычек: «Перемотай плёнку», «5-4-3-2-1», «Весы решения», «Цепочка событий», «Противоположное действие». Они же есть в «Тянет заесть».</li></ul></details>
    <details><summary>Мудборд</summary>
      <p>До 12 картинок, которые вдохновляют. Нажми на картинку, чтобы открыть крупно или убрать.</p></details>
    <details><summary>Тянет заесть</summary>
      <ol><li><b>Что на самом деле?</b> Голод — тогда просто нормально поесть. Или усталость, грусть, злость и тревога, одиночество, скука, «просто хочу сладкого».</li>
      <li><b>Насколько сильно?</b> От 1 до 10.</li>
      <li><b>Что попробуешь?</b> Сначала твои приёмы, которые уже помогали, и планы «если — то». «Другие варианты» — стандартные подсказки.</li>
      <li><b>Сёрфинг</b> — волна, таймер на 10 минут и подсказки.</li>
      <li><b>Прошло?</b> Да или нет. Если да — напиши своими словами, что помогло. Эти приёмы в следующий раз будут первыми, а победа попадёт в копилку.</li></ol>
      <p><b>«Я уже переела»</b> — не отчёт, а поддержка: следующий приём пищи как обычно, без наказаний.</p>
      <p>Свои переключалки добавляются в ⚙︎ → «Мои переключалки».</p></details>
    <details><summary>Раз в две недели</summary>
      <p>В последний день спринта появится карточка «Итоги спринта». Утром, до завтрака: примерка контрольных вещей (давят / давят меньше / свободно), весы, потом экран итогов — вес, копилка побед, твои топ-приёмы, наблюдения по сну, тренировкам и циклу, мягкие ачивки. Если это дни перед месячными, можно взвеситься через пару дней — карточка подождёт.</p></details>
    <details><summary>Цикл</summary>
      <p>Всё про цикл — в ⚙︎. Один раз впиши, какой сегодня день, дальше приложение считает само по средней длине. Когда начнутся месячные, нажми там «Месячные начались сегодня». Данные используются в итогах спринта и подсказках.</p></details>
    <details><summary>Если что-то не так</summary>
      <ul><li>Не видно обновлений — в приложении «…» → Reload Page.</li>
      <li>Внизу надпись «Сейчас это превью» — данные не попадают в облако Телеграма, открой приложение через кнопку в боте.</li>
      <li>Раз в месяц полезно сохранить ⚙︎ → «Резервная копия» себе в «Избранное».</li></ul></details>
    </div>
    <button class="btn full" style="margin-top:14px" data-act="bg-close">Понятно</button>`),
  mysw: () => { const my = S.cfg.mysw || [];
    modal(`<h2>Мои переключалки</h2><p class="lead">То, что помогает именно тебе. Они будут появляться среди вариантов, а те, после которых чаще «отпускает», — чаще.</p>
      ${my.length ? `<ul class="myl">${my.map(o => `<li><span>${esc(o[1])}</span><button class="x" data-act="mysw-del" data-v="${o[0]}" aria-label="Удалить">×</button></li>`).join('')}</ul>` : ''}
      <div class="inrow"><input class="inp" id="mysw_in" maxlength="60" placeholder="например, полить цветы" style="max-width:none"><button class="btn" data-act="mysw-add">Добавить</button></div>
      <button class="btn ghost full" style="margin-top:14px" data-act="bg-close">Готово</button>`); },
  'mysw-add': async () => { const v = document.getElementById('mysw_in').value.trim(); if (!v) return;
    S.cfg.mysw = [...(S.cfg.mysw || []), ['m' + Date.now().toString(36).slice(-5), v.slice(0,60)]].slice(-12); await saveCfg(); A.mysw(); },
  'mysw-del': async b => { S.cfg.mysw = (S.cfg.mysw || []).filter(o => o[0] !== b.dataset.v); await saveCfg(); A.mysw(); },
  onb: async () => {
    const d = document.getElementById('o_d').value || today(), w = val('o_w'), wa = val('o_wa');
    Object.assign(S.cfg, {onb:true, start:d, name: document.getElementById('o_n').value.trim().slice(0,20), goal: val('o_g') || null});
    if (w) { S.meas = S.meas.filter(m => m.n !== 0); S.meas.push({n:0, d, w, wa}); }
    S.cfg.seen = today(); await Promise.all([saveCfg(), Store.set('meas', S.meas)]); render();
    modal(`<div class="morning">${ART.flower}<p class="muted small" style="margin:6px 0 0">Первый день</p>
      <p class="q">Не нужно всё сразу. Просто начни — и будь к себе нежной по дороге.</p><button class="btn full" data-act="bg-close">Начинаем ♡</button></div>`);
  },
  'res-save': async () => {
    const n = RS.n, w = val('r_w'), wa = val('r_wa'), note = document.getElementById('r_n').value.trim().slice(0,200);
    S.meas = S.meas.filter(m => m.n !== n); S.meas.push({n, d: today(), w, wa, fits: RS.fits});
    if (note) S.notes[n] = note;
    await Promise.all([Store.set('meas', S.meas), Store.set('notes', S.notes)]); render(); resultSummary(n, true);
  },
  'res-skip': async b => { S.cfg.skip = [...(S.cfg.skip || []), +b.dataset.v]; await saveCfg(); close(); render(); },
  'set-save': async () => {
    const c = S.cfg;
    Object.assign(c, {name: document.getElementById('c_n').value.trim() || c.name, kcal: val('c_k') || c.kcal, steps: val('c_st') || c.steps,
      s: val('c_s') ?? c.s, p: val('c_p') ?? c.p, cmin: val('c_c') || c.cmin || 130, start: document.getElementById('c_d').value || c.start,
      we: [val('c_e0') || c.we[0], val('c_e1') || c.we[1], val('c_e2') || c.we[2]], goal: val('c_g') || c.goal || null, clen: Math.min(45, Math.max(20, val('c_cl') || c.clen || 28))});
    await saveCfg(); close(); render(); toast('Сохранено');
  },
  export: () => { const data = JSON.stringify({cfg:S.cfg, days:S.days, good:S.good, meas:S.meas, notes:S.notes});
    modal(`<h2>Резервная копия</h2><p class="lead">Скопируй и сохрани себе в «Избранное». Картинки в копию не входят.</p><textarea class="inp" readonly style="min-height:140px;font-size:12px">${esc(data)}</textarea>`); }
};
let noteTimer = null;
function noteGrow(el){ el.style.height = 'auto'; el.style.height = Math.max(96, el.scrollHeight + 2) + 'px'; }
document.addEventListener('input', e => { if (e.target.id !== 'notes') return; noteGrow(e.target);
  const v = S.view; S.eat[v] = e.target.value; if (S.good[v] && !e.target.value.includes(S.good[v])) { S.good[v] = ''; saveMonth(v, 'g', S.good); }
  clearTimeout(noteTimer); noteTimer = setTimeout(() => saveEat(v), 800); });
document.addEventListener('focusout', e => { if (e.target.id === 'notes') { clearTimeout(noteTimer); saveEat(S.view); toast('Сохранено ✓'); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'notes') return; if (e.key === 'Enter' && e.target.matches && e.target.matches('input.inp')) e.target.blur(); });
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && A[b.dataset.act]) A[b.dataset.act](b, e); });
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'file') { const f = el.files && el.files[0]; el.value = ''; if (!f) return;
    try { const src = await compress(f); await savePhoto(src); render(); toast('Картинка на доске'); }
    catch (err) { toast('Не получилось загрузить, попробуй другую картинку'); } return; }
  if (el.dataset.g) { const v = S.view; S.good[v] = el.value.trim().slice(0,80); await saveMonth(v, 'g', S.good); toast('Записала ♡'); return; }
  const f = el.dataset.f; if (!f) return;
  const v = parseFloat(String(el.value).replace(/\s/g,'').replace(',', '.'));
  const p = {[f]: isNaN(v) ? null : Math.round(v)}; if (f === 'k') p.e = null; if (f === 'cm') p.w = ((S.days[S.view] || {}).w || []).filter(x => x !== 'c'); await patchDay(p); toast('Сохранено ✓');
});

(async () => {
  try { await load(); } catch (e) { console.error(e); }
  if (!S.cfg.start) S.cfg.start = today();
  document.getElementById('fab').hidden = false;
  render();
  if (!S.cfg.onb) onboarding();
  else if (/[?&]go=dolce/.test(location.search) || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param === 'dolce')) dolceStart();
  else if (new Date().getHours() < 13 && S.cfg.seen !== today()) morningModal();
})();
</script>
</body>
