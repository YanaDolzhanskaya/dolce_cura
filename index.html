<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dolce Cura</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF4EF; --card:#FFFCFA; --blush:#F7E1DF; --blush2:#F1CFCF; --rose:#E2A2AA; --rose-deep:#B96C79;
  --cocoa:#5B3F40; --muted:#9E8683; --line:#F0E1DC; --milk:#FFF8F2; --sage:#B7C4A8; --lemon:#F3DD8C;
  color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--cocoa);font:16px/1.5 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px}
img{max-width:100%}
.app{max-width:500px;margin:0 auto;padding:18px 18px 110px}
.hand{font-family:'Caveat','Segoe Print',cursive;font-size:22px;line-height:1.2;color:var(--rose-deep)}
.muted{color:var(--muted)}
.small{font-size:14px}

header{display:flex;justify-content:space-between;align-items:flex-start;margin:4px 0 18px}
.hello{display:flex;gap:10px;align-items:center}
.hello svg{width:44px;height:44px;flex:none}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:30px;line-height:1.05;margin:0}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:17px;color:var(--rose-deep);line-height:1;margin-bottom:2px}
.date{font-size:14px;color:var(--muted);margin-top:4px}
.gear{border:none;background:var(--blush);width:40px;height:40px;border-radius:50%;font-size:17px;color:var(--rose-deep)}

.card{background:var(--card);border-radius:28px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px -18px rgba(185,108,121,.45)}
.card h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:25px;line-height:1.15;margin:0 0 4px}
.card .sub{margin:0 0 16px;font-size:14px;color:var(--muted)}

/* moodboard */
.board{padding:10px}
.pins{columns:2;column-gap:8px}
.pin{display:block;width:100%;margin:0 0 8px;break-inside:avoid;border:none;padding:0;background:none;border-radius:20px;overflow:hidden}
.pin img{display:block;width:100%;height:auto}
.pin.add{aspect-ratio:3/4;background:var(--milk);border:1.5px dashed var(--blush2);color:var(--rose-deep);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pin.add svg{width:64px;height:64px}
.pin.add.plus{aspect-ratio:3/4;font-size:34px;font-weight:400;color:var(--rose)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--blush);border-radius:999px;padding:4px;margin:0 0 16px}
.tabs button{border:none;background:none;border-radius:999px;padding:9px 0;font-size:15px;color:var(--rose-deep);font-weight:600}
.tabs button.on{background:var(--card);color:var(--cocoa);box-shadow:0 2px 8px -4px rgba(185,108,121,.5)}
.bella .hand{font-size:21px;margin:8px 0 2px}
.board-empty{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board-empty .pin.add:first-child{grid-row:span 2;aspect-ratio:auto}
.board-body{padding:8px 10px 8px}
.why{margin:4px 0 6px;font-size:25px}
.linkbtn{border:none;background:none;padding:0;color:var(--rose-deep);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* sprint */
.sprint{background:linear-gradient(160deg,var(--blush) 0%,var(--milk) 75%);position:relative;overflow:hidden}
.sprint .deco{position:absolute;right:-22px;top:-26px;width:104px;opacity:.85}
.sprint > *:not(.deco){position:relative;z-index:1}
.sprint .n{font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;font-weight:500;line-height:1;margin:2px 0 6px}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin:16px 0 6px}
.dots i{aspect-ratio:1;border-radius:50%;background:#fff;border:1.5px solid var(--blush2)}
.dots i.past{background:var(--rose);border-color:var(--rose)}
.dots i.now{background:#fff;border:2px solid var(--rose-deep)}
.dots i.wk{margin-left:6px}
.sprint .hand{margin:10px 0 0}

/* forms */
.daynav{display:flex;gap:6px}
.daynav button{border:none;background:var(--blush);width:34px;height:34px;border-radius:50%;color:var(--rose-deep);font-size:17px}
.daynav button:disabled{opacity:.35;cursor:default}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{margin-top:16px}
.field label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.inrow{display:flex;align-items:center;gap:10px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--milk);border-radius:16px;padding:12px 14px;font-size:17px}
.inp:focus{outline:none;border-color:var(--rose)}
.inrow .inp{max-width:150px}
.unit{color:var(--muted);font-size:15px}
.soft{height:10px;border-radius:99px;background:var(--blush);overflow:hidden;margin-top:10px}
.soft i{display:block;height:100%;border-radius:99px;background:var(--rose);transition:width .3s}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--blush2);background:transparent;border-radius:999px;padding:9px 16px;font-size:15px;color:var(--cocoa)}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:none;background:var(--milk);border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mood i{width:26px;height:26px;border-radius:50%;display:block}
.mood.on{background:var(--blush);color:var(--cocoa);font-weight:600}
.mood.on i{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--rose-deep)}

/* week */
.goal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:none;padding-bottom:0}
.goal .t{font-size:16px}
.goal .v{font-size:14px;color:var(--muted);text-align:right}
.pips{display:flex;gap:6px}
.pips i{width:14px;height:14px;border-radius:50%;background:var(--blush);border:1.5px solid var(--blush2)}
.pips i.on{background:var(--rose);border-color:var(--rose)}
.goal .soft{grid-column:1/-1;margin-top:4px}
.heart{color:var(--rose-deep)}

.btn{border:none;border-radius:18px;padding:13px 20px;font-weight:600;font-size:15px;background:var(--rose-deep);color:#fff}
.btn.ghost{background:var(--blush);color:var(--rose-deep)}
.btn.full{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
textarea.inp{min-height:84px;resize:vertical;font-size:16px}
.hist{margin:0;padding:0;list-style:none}
.hist li{padding:12px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:none}
.hist .top{display:flex;justify-content:space-between;gap:10px}
.hist .top b{font-weight:600}
.hist .hand{font-size:20px;margin-top:4px}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:22px}

/* dolce */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;border:none;border-radius:999px;padding:13px 22px 13px 16px;background:var(--cocoa);color:var(--cream);font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px -10px rgba(91,63,64,.6)}
.fab svg{width:26px;height:26px}
.reasons{display:grid;gap:8px}
.reason{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;font-size:16px}
.reason small{display:block;color:var(--muted);font-size:13px}
.it{background:var(--milk);border-radius:24px;padding:18px;text-align:center;margin:14px 0;position:relative;overflow:hidden}
.it .tile{position:absolute;inset:0;width:100%;height:100%;opacity:.28;pointer-events:none}
.it > *:not(.tile){position:relative}
.it .ph{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:30px;line-height:1.15;margin:0}
.it .tr{margin:8px 0 2px;font-size:16px}
.it .pr{font-size:14px;color:var(--muted);margin:0}
.ring{display:block;width:150px;height:150px;margin:6px auto 4px}
.ring .bg{stroke:var(--blush)}
.ring .fg{stroke:var(--rose-deep);transition:stroke-dashoffset 1s linear}
.ring text{fill:var(--cocoa);font:600 28px 'Manrope',sans-serif}
.tip{background:var(--blush);border-radius:20px;padding:14px 16px;margin:0 0 12px;font-size:15px}

.modal{position:fixed;inset:0;background:rgba(91,63,64,.28);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--cream);width:100%;max-width:500px;border-radius:30px 30px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:28px;margin:0 0 6px}
.sheet .lead{margin:0 0 16px;color:var(--muted)}
.sheet .lead + .field,.sheet .lead + .two > .field{margin-top:0}
.viewer img{display:block;width:100%;border-radius:22px;margin-bottom:14px}
.plate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plate .ph{position:relative;aspect-ratio:1;border:none;padding:0;border-radius:18px;overflow:hidden;background:var(--blush)}
.plate .ph img{width:100%;height:100%;object-fit:cover;display:block}
.plate .ph span{position:absolute;left:6px;bottom:6px;background:rgba(255,252,250,.9);border-radius:10px;padding:1px 7px;font-size:12px;color:var(--cocoa)}
.plate .ph.add{background:var(--milk);border:1.5px dashed var(--blush2);color:var(--rose-deep);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.plate .ph.add svg{width:34px;height:34px}
.morning{text-align:center;padding-top:6px}
.morning svg{width:84px;height:84px}
.itq{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:24px;line-height:1.2;margin:12px 0 0;max-width:85%}
.morning .q{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;line-height:1.2;margin:10px 0 18px}
.bella{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;padding:14px 18px 14px 10px}
.bella svg{width:132px;height:auto;display:block}
.bella h2{margin-bottom:2px}
.bella .new{margin:8px 0 10px;font-size:14px}
.bella .new b{font-weight:600;color:var(--rose-deep)}
.bl{list-style:none;margin:0 0 6px;padding:0}
.bl li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.bl li:last-child{border-bottom:none}
.bl li i{font-style:normal;color:var(--rose-deep);width:14px;flex:none}
.bl li.no{color:var(--muted)}
.bl small{display:block;color:var(--muted);font-size:13px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .chip{padding:12px 0;font-size:17px;font-weight:600}
.wave{position:relative;height:110px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--milk),var(--blush));margin:6px 0 10px}
.wave svg{position:absolute;left:0;bottom:0;width:200%;height:90px;animation:swell 7s ease-in-out infinite}
.wave .w1{fill:var(--rose);opacity:.55}
.wave .w2{fill:var(--rose-deep);opacity:.25}
@keyframes swell{0%{transform:translateX(0) translateY(6px)}50%{transform:translateX(-25%) translateY(-6px)}100%{transform:translateX(-50%) translateY(6px)}}
.wave-t{position:absolute;top:14px;left:0;right:0;text-align:center;font:600 30px 'Manrope',sans-serif;color:var(--cocoa)}
.wave-p{min-height:48px;margin:0 0 4px;font-size:16px;text-align:center}
.myl{list-style:none;margin:0 0 12px;padding:0}
.myl li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.myl .x{border:none;background:none;color:var(--muted);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cocoa);color:var(--cream);padding:10px 18px;border-radius:18px;font-size:15px;z-index:30;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"><p class="muted">Секунду…</p></div>
<button class="fab" data-act="dolce" id="fab" hidden><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 17h20v5a10 10 0 0 1-20 0z" fill="#F7E1DF"/><path d="M28 19h2.5a3.5 3.5 0 0 1 0 7H27" fill="none" stroke="#F7E1DF" stroke-width="2.4"/><path d="M18 21.5c-1.6-1.6-4-.3-3 1.6.6 1.1 3 2.7 3 2.7s2.4-1.6 3-2.7c1-1.9-1.4-3.2-3-1.6z" fill="#B96C79"/><path d="M14 13c0-2 2-2 2-4M20 13c0-2 2-2 2-4" fill="none" stroke="#F7E1DF" stroke-width="1.8" stroke-linecap="round"/></svg>Тянет заесть</button>
<div id="layer"></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="ffile" accept="image/*" hidden>
<script>
/* ---------- иллюстрации (свои, нарисованы кодом) ---------- */
const ART = {
  flower: `<svg viewBox="0 0 60 60" aria-hidden="true"><g transform="translate(30 27)">${[0,72,144,216,288].map(a=>`<ellipse rx="7.5" ry="12" transform="rotate(${a}) translate(0 -11)" fill="#F1CFCF"/>`).join('')}<circle r="6" fill="#F3DD8C"/></g><path d="M30 38c0 8-2 14-6 18" stroke="#B7C4A8" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="25" cy="49" rx="6" ry="3" transform="rotate(-35 25 49)" fill="#B7C4A8"/></svg>`,
  lemons: `<svg viewBox="0 0 140 120" class="deco" aria-hidden="true"><path d="M20 40c30-10 60-5 100 20" stroke="#B7C4A8" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="60" cy="62" rx="20" ry="15" transform="rotate(20 60 62)" fill="#F3DD8C"/><ellipse cx="98" cy="78" rx="17" ry="13" transform="rotate(-15 98 78)" fill="#F3DD8C"/><ellipse cx="40" cy="36" rx="14" ry="6" transform="rotate(-25 40 36)" fill="#B7C4A8"/><ellipse cx="82" cy="45" rx="13" ry="5.5" transform="rotate(30 82 45)" fill="#B7C4A8"/><circle cx="54" cy="58" r="2.5" fill="#fff" opacity=".7"/></svg>`,
  tile: `<svg class="tile" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="t" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="scale(.7)"><rect width="40" height="40" fill="none"/><circle cx="20" cy="20" r="7" fill="none" stroke="#E2A2AA" stroke-width="1.5"/><path d="M20 0v8M20 32v8M0 20h8M32 20h8" stroke="#B7C4A8" stroke-width="1.5"/><circle cx="0" cy="0" r="4" fill="#F3DD8C"/><circle cx="40" cy="0" r="4" fill="#F3DD8C"/><circle cx="0" cy="40" r="4" fill="#F3DD8C"/><circle cx="40" cy="40" r="4" fill="#F3DD8C"/></pattern></defs><rect width="320" height="200" fill="url(#t)"/></svg>`,
  cam: `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="12" width="30" height="21" rx="6" fill="#F7E1DF"/><path d="M14 12l2.5-4h7L26 12" fill="#F7E1DF"/><circle cx="20" cy="22.5" r="6" fill="#fff"/><circle cx="20" cy="22.5" r="3.5" fill="#E2A2AA"/></svg>`,
  frame: `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="8" width="44" height="50" rx="10" fill="#F7E1DF"/><path d="M22 44l8-10 6 7 4-4 6 7z" fill="#E2A2AA"/><circle cx="40" cy="24" r="4" fill="#F3DD8C"/></svg>`
};

/* ---------- Telegram и хранилище ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const cloudOk = inTg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('6.9');
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#FBF4EF'); tg.setBackgroundColor && tg.setBackgroundColor('#FBF4EF'); } catch (e) {} }
const haptic = () => { try { inTg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('soft'); } catch (e) {} };

const PFX = 'dn_';
const Store = {
  async keys(){
    if (cloudOk) return new Promise(r => tg.CloudStorage.getKeys((e,k) => r(e ? [] : (k || []))));
    const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PFX)) out.push(k.slice(PFX.length)); } } catch (e) {}
    return out;
  },
  async getMany(keys){
    const out = {};
    if (cloudOk) { for (let i = 0; i < keys.length; i += 20) {
        const got = await new Promise(r => tg.CloudStorage.getItems(keys.slice(i, i+20), (e,v) => r(e ? {} : (v || {}))));
        Object.assign(out, got); } return out; }
    try { keys.forEach(k => { const v = localStorage.getItem(PFX + k); if (v != null) out[k] = v; }); } catch (e) {}
    return out;
  },
  async getAll(){
    if (cloudOk) {
      const keys = (await Store.keys()).filter(k => !k.startsWith('f_'));
      const out = {};
      for (let i = 0; i < keys.length; i += 20) {
        const got = await new Promise(r => tg.CloudStorage.getItems(keys.slice(i, i+20), (e,v) => r(e ? {} : (v || {}))));
        Object.assign(out, got);
      }
      return out;
    }
    const out = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(PFX) && !k.startsWith(PFX + 'f_')) out[k.slice(PFX.length)] = localStorage.getItem(k); } } catch (e) {}
    return out;
  },
  set(key, val){
    const s = JSON.stringify(val);
    if (cloudOk) return new Promise(r => tg.CloudStorage.setItem(key, s, e => { if (e) toast('Не получилось сохранить, попробуй ещё раз'); r(); }));
    try { localStorage.setItem(PFX + key, s); } catch (e) { toast('Не хватило места в браузере'); }
    return Promise.resolve();
  },
  remove(keys){
    if (!keys.length) return Promise.resolve();
    if (cloudOk) return new Promise(r => tg.CloudStorage.removeItems(keys, () => r()));
    try { keys.forEach(k => localStorage.removeItem(PFX + k)); } catch (e) {}
    return Promise.resolve();
  }
};

/* ---------- даты ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => iso(new Date());
const MG = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const fmtD = s => { const d = parse(s); return `${d.getDate()} ${MG[d.getMonth()]}`; };
const num = (v, f=1) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('ru-RU', {maximumFractionDigits:f});
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function plural(n,a,b,c){ n = Math.abs(n) % 100; const m = n % 10; if (n > 10 && n < 20) return c; if (m > 1 && m < 5) return b; if (m === 1) return a; return c; }

/* ---------- состояние ---------- */
const S = {

async function load(){
  const all = await Store.getAll();
  const j = k => { try { return all[k] ? JSON.parse(all[k]) : null; } catch (e) { return null; } };
  if (j('cfg')) Object.assign(S.cfg, j('cfg'));
  S.meas = j('meas') || []; S.notes = j('notes') || {};
  Object.keys(all).forEach(k => {
    let m = k.match(/^d_(\d{4})_(\d{2})$/);
    if (m) { const mo = j(k) || {}; Object.keys(mo).forEach(dd => S.days[`${m[1]}-${m[2]}-${dd}`] = mo[dd]); }
    m = k.match(/^g_(\d{4})_(\d{2})$/);
    if (m) { const mo = j(k) || {}; Object.keys(mo).forEach(dd => S.good[`${m[1]}-${m[2]}-${dd}`] = mo[dd]); }
  });
  const cutoff = addDays(today(), -13).replace(/-/g,''); const stale = [];
  Object.keys(all).forEach(k => { const m = k.match(/^fi_(\d{8})$/); if (!m) return;
    const list = j(k) || [];
    if (m[1] < cutoff) { stale.push(k); list.forEach(p => { for (let i = 0; i < p.n; i++) stale.push(`f_${m[1]}_${p.id}_${i}`); }); }
    else S.food[`${m[1].slice(0,4)}-${m[1].slice(4,6)}-${m[1].slice(6)}`] = list; });
  if (stale.length) Store.remove(stale);
  const mb = j('mb') || [];
  S.photos = mb.map(p => { let t = ''; for (let i = 0; i < p.n; i++) t += j(`p_${p.id}_${i}`) || ''; return {id:p.id, n:p.n, src:t}; }).filter(p => p.src.startsWith('data:image'));
  const oldN = j('imgn'); // фото из прошлой версии
  if (oldN && !mb.length) { let t = ''; for (let i = 0; i < oldN; i++) t += j('img_' + i) || '';
    if (t.startsWith('data:image')) { await savePhoto(t); await Store.set('imgn', 0); } }
}
const saveCfg = () => Store.set('cfg', S.cfg);
function saveMonth(ds, key='d', src=S.days){ const [y,m] = ds.split('-'); const out = {};
  Object.keys(src).forEach(k => { if (k.startsWith(`${y}-${m}-`) && src[k] != null && src[k] !== '') out[k.slice(8)] = src[k]; });
  return Store.set(`${key}_${y}_${m}`, out); }
async function savePhoto(src){
  const id = Date.now().toString(36).slice(-6); const parts = [];
  for (let i = 0; i < src.length; i += 4000) parts.push(src.slice(i, i + 4000));
  await Promise.all(parts.map((p, i) => Store.set(`p_${id}_${i}`, p)));
  S.photos.push({id, n: parts.length, src});
  await Store.set('mb', S.photos.map(p => ({id:p.id, n:p.n})));
}
async function deletePhoto(id){
  const p = S.photos.find(x => x.id === id); if (!p) return;
  S.photos = S.photos.filter(x => x.id !== id);
  await Store.set('mb', S.photos.map(x => ({id:x.id, n:x.n})));
  await Store.remove(Array.from({length:p.n}, (_, i) => `p_${id}_${i}`));
}

const ymd = ds => ds.replace(/-/g,'');
async function ensureFood(ds){
  const list = S.food[ds] || []; const need = list.filter(p => !S.foodSrc[p.id]);
  if (!need.length) return;
  const keys = []; need.forEach(p => { for (let i = 0; i < p.n; i++) keys.push(`f_${ymd(ds)}_${p.id}_${i}`); });
  const got = await Store.getMany(keys);
  need.forEach(p => { let t = ''; for (let i = 0; i < p.n; i++) { try { t += JSON.parse(got[`f_${ymd(ds)}_${p.id}_${i}`] || '""'); } catch (e) {} } if (t) S.foodSrc[p.id] = t; });
  if (ds === S.view) render();
}
async function addFood(ds, src){
  const id = Date.now().toString(36).slice(-5); const parts = [];
  for (let i = 0; i < src.length; i += 4000) parts.push(src.slice(i, i + 4000));
  await Promise.all(parts.map((p, i) => Store.set(`f_${ymd(ds)}_${id}_${i}`, p)));
  const now = new Date(); const t = ds === today() ? `${pad(now.getHours())}:${pad(now.getMinutes())}` : '';
  S.food[ds] = [...(S.food[ds] || []), {id, n: parts.length, t}]; S.foodSrc[id] = src;
  await Store.set(`fi_${ymd(ds)}`, S.food[ds]);
}
async function delFood(ds, id){
  const p = (S.food[ds] || []).find(x => x.id === id); if (!p) return;
  S.food[ds] = S.food[ds].filter(x => x.id !== id); delete S.foodSrc[id];
  await Store.set(`fi_${ymd(ds)}`, S.food[ds]);
  await Store.remove(Array.from({length:p.n}, (_, i) => `f_${ymd(ds)}_${id}_${i}`));
}

function blooms(){
  const u = {}, days = Object.values(S.days);
  if (days.some(d => d && (d.k || d.st || (d.w || []).length || d.m))) u.blush = 1;
  for (let w = S.cfg.start; w <= today(); w = addDays(w, 7)) { const x = weekStats(w);
    if (x.s >= S.cfg.s && x.p >= S.cfg.p && x.c >= S.cfg.c && (S.cfg.s + S.cfg.p + S.cfg.c) > 0) u.sneakers = 1;
    if (x.steps >= S.cfg.steps) u.street = 1; }
  if (days.some(d => (d.u || []).some(x => x[2] === 'p'))) u.bouquet = 1;
  if (days.filter(d => d.m).length >= 7) u.headband = 1;
  if (Object.values(S.good).filter(Boolean).length >= 5) u.hearts = 1;
  if (S.meas.some(m => m.n >= 1)) u.bag = 1;
  if (sprintOf(today()) >= 3) u.scarf = 1;
  if (S.meas.some(m => m.fit === 'yes')) u.skirt = 1;

}
function shapeF(){ // меняется только по итогам спринтов и никогда не идёт назад
  const st = measFor(0); if (!st || !st.w) return 0;
  const res = S.meas.filter(m => m.n >= 1 && m.w).map(m => m.w); if (!res.length) return 0;
  const range = st.w - (S.cfg.goal || 65); if (range <= 0) return 0;
  return Math.max(0, Math.min(1, (st.w - Math.min(...res)) / range));
}

function weekStats(from){
  let s = 0, p = 0, c = 0, steps = 0, kSum = 0, kDays = 0, est = false, urges = 0, passed = 0, tu = 0, bs = 0, as = 0, ns = 0; const why = {};
  for (let i = 0; i < 7; i++) { const dsx = addDays(from, i), d = S.days[dsx]; if (!d) continue;
    const w = d.w || []; if (w.includes('s')) s++; if (w.includes('p')) p++; if (w.includes('c')) c++;
    steps += d.st || 0; if (d.e) est = true; if (d.k) { kSum += d.k; kDays++; }
    (d.u || []).forEach(u => { if (u[1] === 'h') return; urges++; if (tender(dsx)) tu++; if (u[3] && u[4]) { bs += u[3]; as += u[4]; ns++; } why[u[1]] = (why[u[1]] || 0) + 1; if (u[2] === 'p') passed++; }); }
  const top = Object.keys(why).sort((a,b) => why[b] - why[a])[0];
  return {s, p, c, steps, kDays, est, urges, passed, top, tu, bAvg: ns ? Math.round(bs / ns) : 0, aAvg: ns ? Math.round(as / ns) : 0, kAvg: kDays ? Math.round(kSum / kDays) : null};
}

  /* история */
  const sorted = [...S.meas].sort((a,b) => a.n - b.n);
  const hist = sorted.filter(m => m.n > 0).map(m => {

      <div class="small muted">${ch}${m.fit ? `${ch ? ', ' : ''}${esc(S.cfg.item.toLowerCase())} ${FIT[m.fit]}` : ''}</div>${S.notes[m.n] ? `<div class="hand">${esc(S.notes[m.n])}</div>` : ''}</li>`; }).join('');

  const head = `<header><div class="hello">${ART.flower}<div><div class="brand">Dolce Cura</div><h1>${greet()}, ${esc(S.cfg.name)}</h1><div class="date">${WD[parse(t).getDay()]}, ${fmtD(t)}</div></div></div>
    <button class="gear" data-act="settings" aria-label="Настройки">⚙︎</button></header>
  <div class="tabs" role="tablist"><button role="tab" data-act="tab" data-v="day" class="${S.tab !== 'board' ? 'on' : ''}" aria-selected="${S.tab !== 'board'}">Мой день</button><button role="tab" data-act="tab" data-v="board" class="${S.tab === 'board' ? 'on' : ''}" aria-selected="${S.tab === 'board'}">Мудборд</button></div>`;
  if (S.tab === 'board') { $app.innerHTML = head + board; return; }
  $app.innerHTML = `
  ${head}
  ${resultCard}
  ${bellaCard}
  <section class="card sprint">${ART.lemons}
    <div class="small muted">Спринт ${n + 1}, ${fmtD(st)} — ${fmtD(end)}</div>
    <div class="n">день ${dayN} из 14</div>
    <div class="dots" aria-hidden="true">${dots}</div>
    ${dayN === 14 ? '<p class="hand">Последний день спринта. Завтра утром — весы, примерка и пара слов о себе.</p>' : `<p class="itq">${kind[0]}</p><p class="hand" style="margin-top:2px">${kind[1]}</p>`}
  </section>
  <section class="card">
    <div class="head"><h2>${v === t ? 'Сегодня' : fmtD(v)}</h2>
      <div class="daynav"><button data-act="day" data-v="-1" ${v <= minView ? 'disabled' : ''} aria-label="Предыдущий день">‹</button>
      <button data-act="day" data-v="1" ${v >= t ? 'disabled' : ''} aria-label="Следующий день">›</button></div></div>
    <div class="field"><label for="k">${isWe ? 'Калории, можно примерно' : 'Калории'}</label>
      ${weChips}<div class="inrow"><input class="inp" id="k" data-f="k" inputmode="numeric" placeholder="1600" value="${d.k ?? ''}"><span class="unit">ккал</span></div>
      <div class="soft"><i style="width:${kPct}%"></i></div><p class="note">${kNote}</p></div>
    <div class="field"><label for="st">Шаги</label>
      <div class="inrow"><input class="inp" id="st" data-f="st" inputmode="numeric" placeholder="8000" value="${d.st ?? ''}"><span class="unit">шагов</span></div></div>

      <div class="chips">${chip('s','Силовая')}${chip('p','Пилатес')}${chip('c','Кардио')}</div></div>

        <button class="chip ${isStart ? 'on' : ''}" data-act="cyc" aria-pressed="${isStart}">${isStart ? 'Начались ✓' : 'Месячные начались'}</button></div></div>
  </section>
  <section class="card">
    <h2>Моя тарелка</h2>

    ${(S.food[v] || []).length ? `<p class="note">${v === t ? 'Сегодня' : 'В этот день'} ${S.food[v].length} ${plural(S.food[v].length,'фото','фото','фото')}. Вечером полистай — так проще увидеть, что было на самом деле</p>` : ''}

async function patchDay(p){ const v = S.view; S.days[v] = Object.assign({}, S.days[v] || {}, p); render(); await saveMonth(v); }
async function compress(file, steps=[[640,.7],[540,.62],[440,.55],[360,.5]], limit=56000){
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  let out = '';
  for (const [side, q] of steps) {
    const k = Math.min(1, side / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    out = cv.toDataURL('image/jpeg', q); if (out.length < limit) break;
  }
  return out;
}

  'mysw-del': async b => { S.cfg.mysw = (S.cfg.mysw || []).filter(o => o[0] !== b.dataset.v); await saveCfg(); A.mysw(); },
  onb: async () => {
    const d = document.getElementById('o_d').value || today(), w = val('o_w'), wa = val('o_wa');
    Object.assign(S.cfg, {onb:true, start:d});
    if (w) { S.meas = S.meas.filter(m => m.n !== 0); S.meas.push({n:0, d, w, wa}); }
    S.cfg.seen = today(); await Promise.all([saveCfg(), Store.set('meas', S.meas)]); render();
    modal(`<div class="morning">${ART.flower}<p class="muted small" style="margin:6px 0 0">Первый день</p>
      <p class="q">Не нужно всё сразу. Просто начни — и будь к себе нежной по дороге.</p><button class="btn full" data-act="bg-close">Начинаем ♡</button></div>`);
  },
  'res-save': async b => {
    const n = +b.dataset.v, w = val('r_w'), wa = val('r_wa'), note = document.getElementById('r_n').value.trim().slice(0,200);
    if (w == null) { toast('Впиши вес или нажми «Пропустить»'); return; }
    const fitEl = document.querySelector('[data-act="fitpick"].on');
    S.meas = S.meas.filter(m => m.n !== n); S.meas.push({n, d: today(), w, wa, fit: fitEl ? fitEl.dataset.v : null});
    if (note) S.notes[n] = note;
    await Promise.all([Store.set('meas', S.meas), Store.set('notes', S.notes)]); close(); render();
    toast(fitEl && fitEl.dataset.v === 'yes' ? 'Застегнулась! Вот это да ♡' : 'Записала. Ты молодец, что продолжаешь');
  },
  'res-skip': async b => { S.cfg.skip = [...(S.cfg.skip || []), +b.dataset.v]; await saveCfg(); close(); render(); },
  'set-save': async () => {
    const c = S.cfg;
    Object.assign(c, {name: document.getElementById('c_n').value.trim() || c.name, kcal: val('c_k') || c.kcal, steps: val('c_st') || c.steps,
      s: val('c_s') ?? c.s, p: val('c_p') ?? c.p, c: val('c_c') ?? c.c, start: document.getElementById('c_d').value || c.start,
      we: [val('c_e0') || c.we[0], val('c_e1') || c.we[1], val('c_e2') || c.we[2]], goal: val('c_g') || c.goal || 65, clen: Math.min(45, Math.max(20, val('c_cl') || c.clen || 28))});
    await saveCfg(); close(); render(); toast('Сохранено');
  },
  export: () => { const data = JSON.stringify({cfg:S.cfg, days:S.days, good:S.good, meas:S.meas, notes:S.notes});
    modal(`<h2>Резервная копия</h2><p class="lead">Скопируй и сохрани себе в «Избранное». Картинки в копию не входят.</p><textarea class="inp" readonly style="min-height:140px;font-size:12px">${esc(data)}</textarea>`); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && A[b.dataset.act]) A[b.dataset.act](b, e); });
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'ffile') { const f = el.files && el.files[0]; el.value = ''; if (!f) return;
    try { const src = await compress(f, [[420,.62],[360,.55],[300,.5]], 20000); const v = S.view; await addFood(v, src); render(); toast('На тарелке ♡'); }
    catch (err) { toast('Не получилось загрузить фото'); } return; }
  if (el.id === 'file') { const f = el.files && el.files[0]; el.value = ''; if (!f) return;
    try { const src = await compress(f); await savePhoto(src); render(); toast('Картинка на доске'); }
    catch (err) { toast('Не получилось загрузить, попробуй другую картинку'); } return; }
  if (el.dataset.g) { const v = S.view; S.good[v] = el.value.trim().slice(0,80); await saveMonth(v, 'g', S.good); toast('Записала ♡'); return; }
  const f = el.dataset.f; if (!f) return;
  const v = parseFloat(String(el.value).replace(/\s/g,'').replace(',', '.'));
  const p = {[f]: isNaN(v) ? null : Math.round(v)}; if (f === 'k') p.e = null; patchDay(p);
});

(async () => {
  try { await load(); } catch (e) { console.error(e); }
  if (!S.cfg.start) S.cfg.start = today();
  document.getElementById('fab').hidden = false;
  render();
  if (!S.cfg.onb) onboarding();
  else if (new Date().getHours() < 13 && S.cfg.seen !== today()) morningModal();
})();
</script>
</body>
</html>
